[project]
name = "drawoffer-eval"
version = "0.1.0"
description = "DrawOffer 长期求职记忆引擎的独立测评"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mem0ai==2.2.1",
  "fastembed>=0.7,<1",
  "drawoffer-backend",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreval"]

[tool.uv.sources]
drawoffer-backend = { path = "../DrawOffer/apps/backend", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
