[project]
name = "drawoffer-eval"
version = "0.1.0"
description = "DrawOffer 长期求职记忆引擎的独立测评"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mem0ai==2.2.1",
  "fastembed>=0.7,<1",
  "drawoffer-backend",
]

[project.optional-dependencies]
kt = [
    "pandas>=2.2",
    "pybkt==1.4.3",
    "scikit-learn>=1.5,<1.6",
    "torch>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreval"]

[tool.uv.sources]
drawoffer-backend = { path = "../DrawOffer/apps/backend", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
